name: Code check

# Runs on every push and pull request: catches syntax errors before `clasp push` / deploy.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Code.js syntax
        run: node --check Code.js

      - name: index.html inline script syntax
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            // Inline <script> blocks only (no src=): these hold the page logic.
            const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
            if (!blocks.length) throw new Error("index.html: inline <script> not found");
            blocks.forEach((code, i) => {
              try { new Function(code); }
              catch (e) { console.error("index.html inline script #" + (i + 1) + ": " + e.message); process.exit(1); }
            });
            console.log("index.html: " + blocks.length + " inline script block(s) OK");
          '

      - name: JSON files are valid
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("appsscript.json", "utf8")); console.log("appsscript.json OK")'
          node -e 'JSON.parse(require("fs").readFileSync(".clasp.json", "utf8")); console.log(".clasp.json OK")'
